name: report-publication-executor
on:
  workflow_call:
    inputs:
      pr_number: {type: string, required: true}
      expected_commit: {type: string, required: true}
      operation_id: {type: string, required: true}
permissions:
  contents: read
  pull-requests: read
  id-token: write
concurrency:
  group: question-bank-cloudflare-production
  cancel-in-progress: false
jobs:
  publish:
    if: vars.REPORT_AUTOMATION_ENABLED == '1'
    environment: report-production
    runs-on: ubuntu-24.04
    steps:
      - name: Authorize real merged PR before any checkout
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          OPERATION_ID: ${{ inputs.operation_id }}
          EXPECTED_BOT: ${{ vars.REPORT_BOT_GITHUB_USER_ID }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[a-f0-9-]{36}$ ]]
          [[ "$EXPECTED_BOT" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_REPOSITORY" == "shicheng0810/question-bank" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          # Read GitHub's token only in memory. Checkout authority comes from
          # the called job identity, never a mutable repository variable/input.
          oidc=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fquestion-bank-78u.pages.dev%2Fapi%2Freport-control")
          claims=$(printf '%s' "$oidc" | jq -r '.value' | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4;if(l==2)$0=$0"==";else if(l==3)$0=$0"=";print}' | base64 -d)
          trusted_sha=$(printf '%s' "$claims" | jq -r '.job_workflow_sha')
          [[ "$trusted_sha" =~ ^[a-f0-9]{40}$ ]]
          printf '%s' "$claims" | jq -e --arg sha "$trusted_sha" '.job_workflow_ref==("shicheng0810/question-bank/.github/workflows/report-publication-executor.yml@"+$sha) and .sha==env.GITHUB_SHA and .workflow_sha==env.GITHUB_SHA and .ref=="refs/heads/main" and .environment=="report-production" and .event_name=="workflow_dispatch" and .workflow_ref=="shicheng0810/question-bank/.github/workflows/report-publication.yml@refs/heads/main"' >/dev/null
          printf 'trusted_sha=%s\n' "$trusted_sha" >> "$GITHUB_OUTPUT"
          unset oidc claims
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/report-pr.json"
          jq -e --arg sha "$EXPECTED_COMMIT" --arg bot "$EXPECTED_BOT" --arg branch "codex/report-$OPERATION_ID" '.merged_at!=null and .merge_commit_sha==$sha and .base.ref=="main" and .base.repo.id==1164285871 and .head.repo.id==1164285871 and .head.ref==$branch and (.user.id|tostring)==$bot' "$RUNNER_TEMP/report-pr.json" >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.context.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 26}
      - name: Install locked trusted dependencies; no lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_commit }}
          path: proposed
          fetch-depth: 0
          persist-credentials: false
      - name: Exact trusted tests
        working-directory: trusted
        run: node --experimental-test-module-mocks --test tests/native-report*.test.mjs tests/report-*.test.mjs
      - name: Trusted serial release; proposed checkout is DATA only
        working-directory: trusted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: node scripts/banks/report-publication-runner.mjs ../proposed "$PR_NUMBER" "$EXPECTED_COMMIT" "$OPERATION_ID"
