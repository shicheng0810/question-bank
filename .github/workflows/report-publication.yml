name: report-publication
on:
  workflow_dispatch:
    inputs:
      pr_number: {type: string, required: true}
      expected_commit: {type: string, required: true}
      operation_id: {type: string, required: true}
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  publish:
    if: vars.REPORT_AUTOMATION_ENABLED == '1'
    # This literal code commit is independent of advancing caller/main data.
    # The called job owns main-only report-production and global concurrency.
    uses: shicheng0810/question-bank/.github/workflows/report-publication-executor.yml@878ee1f92545b4bd4be952dd92e3e4f1f044983f
    with:
      pr_number: ${{ inputs.pr_number }}
      expected_commit: ${{ inputs.expected_commit }}
      operation_id: ${{ inputs.operation_id }}
